# gh-review-watcher 設定例
# macOS + Zellij/herdr + Claude Code を使ったPRレビュー自動化
#
# 注意: 以下の command はプレースホルダ変数 ({repo} {number} {title} {author}
#       {url} {labels}) だけを使い、トークン等の秘密は含めていません。
#       `open-review-tab` / `review-pr` / `close-merged-review-tab` は PATH 上の
#       ヘルパースクリプトを想定した例です。実体の例と設置方法は
#       examples/scripts/ を参照（README に依存関係とシンボリックリンク手順
#       あり）。Notifier.app のパスも環境に合わせて調整を。
#       タブ操作系のヘルパーは実行時に herdr / zellij を判定するので、
#       どちらのマルチプレクサ内で watcher を動かしても同じ設定で機能する。

# ポーリング間隔（秒）
interval = 120

# --- on_start: 起動時に1回 ---
# PRの文脈が無いのでテンプレート変数は展開されない（コマンドはそのまま実行）。

# herdr 内で起動したときはワークスペース名を watcher に合わせる
[[on_start]]
name = "rename-herdr-workspace"
command = """[ "$HERDR_ENV" = "1" ] && [ -n "$HERDR_WORKSPACE_ID" ] \
  && herdr workspace rename "$HERDR_WORKSPACE_ID" gh-review-watcher || true"""

# --- on_new_pr: 新規PR検出時 ---

# ログファイルに記録（デバッグ用）
[[on_new_pr]]
name = "log"
command = "echo '[NEW PR] {repo} #{number} {title} by @{author}' >> /tmp/gh-review-watcher-hooks.log"

# macOS通知
[[on_new_pr]]
name = "notify"
command = """/Applications/Utilities/Notifier.app/Contents/MacOS/Notifier \
  --type banner \
  --title 'PR Review Request' \
  --subtitle '{repo} #{number}' \
  --message {title} \
  --sound default"""

# yoloラベルがなければ新タブでClaude Codeレビューを実行。
# タブの開き方（herdr / zellij）は open-review-tab が実行時に判定する。
[[on_new_pr]]
name = "review-tab"
command = """echo '{labels}' | grep -q yolo || open-review-tab '{url}' '{number}' '{repo}'"""

# --- on_poll: 毎ポーリング ---

# "yolo" ラベルがついたPRはClaude Codeで自動レビュー判定。
# 何が起きたか追えるよう各分岐をログに残している（CHECK→RUN/SKIP）。
[[on_poll]]
name = "yolo-review"
command = """echo '[YOLO-CHECK] {repo}#{number} labels=[{labels}]' >> /tmp/gh-review-watcher-hooks.log && (echo '{labels}' | grep -q yolo && echo '[YOLO-RUN] {repo}#{number}' >> /tmp/gh-review-watcher-hooks.log && claude --dangerously-skip-permissions -p '/yolo-review {number} {repo}' >> /tmp/gh-review-watcher-hooks.log 2>&1 || echo '[YOLO-SKIP] {repo}#{number}' >> /tmp/gh-review-watcher-hooks.log)"""

# --- on_remove: PRがリストから消えた時（マージ・クローズ・レビュー解除等） ---

# レビュータブを自動で閉じる（実行内容をログにも残す）
[[on_remove]]
name = "close-review-tab"
command = "echo '[REMOVE] {repo}#{number}' >> /tmp/gh-review-watcher-hooks.log && close-merged-review-tab '{number}' '{repo}' >> /tmp/gh-review-watcher-hooks.log 2>&1"

# --- on_select: Enter押下時（既定の1アクション） ---

# ブラウザでPRを開く
[on_select]
command = "open {url}"

# --- actions: `a` で開くメニューから選択実行（選択中PRに対して） ---
# 複数定義でき、TUI で `a` → j/k で選び Enter で実行、Esc で閉じる。
# command は他フックと同じ {repo}/{number}/{url}/{labels} 等が使える。

[[actions]]
name = "Rebase (update branch)"
command = "gh pr update-branch {number} -R {repo} --rebase"

[[actions]]
name = "Approve"
command = "gh pr review {number} -R {repo} --approve --body 'LGTM 👍 (manual)'"

[[actions]]
name = "Request changes"
command = "gh pr review {number} -R {repo} --request-changes --body 'CI/変更点を確認してください'"

[[actions]]
name = "Open CI checks (web)"
command = "gh pr checks {number} -R {repo} --web"

# open-review-tab は examples/scripts/ のヘルパー（PATH に置く前提）
[[actions]]
name = "Re-review with Claude (new tab)"
command = "open-review-tab '{url}' '{number}' '{repo}'"

[[actions]]
name = "Copy URL"
command = "printf %s {url} | pbcopy"
